<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener - CodeAlpha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #667eea;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 500px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; }
        .sub { text-align: center; color: #999; font-size: 14px; margin-bottom: 25px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: #667eea; outline: none; }
        button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #5a6fd6; }
        .result {
            margin-top: 15px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            word-break: break-all;
        }
        .result a { color: #667eea; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        th { color: #999; }
        td a { color: #667eea; }
        h2 { font-size: 16px; color: #333; }
    </style>
</head>
<body>
    <div class="box">
        <h1>URL Shortener</h1>
        <p class="sub">CodeAlpha - Backend Development Internship</p>

        <form action="/shorten" method="POST">
            <input type="text" name="url" placeholder="Enter a long URL..." required>
            <button type="submit">Shorten URL</button>
        </form>

        {% if short_url %}
        <div class="result">
            <strong>Shortened URL:</strong><br>
            <a href="{{ short_url }}" target="_blank">{{ short_url }}</a>
        </div>
        {% endif %}

        {% if urls %}
        <h2>Recent URLs</h2>
        <table>
            <tr><th>Short</th><th>Original</th><th>Clicks</th></tr>
            {% for u in urls %}
            <tr>
                <td><a href="/{{ u.short_code }}">{{ u.short_code }}</a></td>
                <td>{{ u.original_url }}</td>
                <td>{{ u.clicks }}</td>
            </tr>
            {% endfor %}
        </table>
        {% endif %}
    </div>
</body>
</html>
